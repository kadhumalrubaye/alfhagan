name: Issue labler
on: 
  issues:
    types: [opened, edited]

jobs:
  lable_issues:
    runs-on: Ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
    # fetch repo
      - name: Checkout repository
        uses:  actions/checkout@latest

    # label issues
      - name: Lable issues
        uses: pelikhan/action-genai-issue-labeller@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: 'gpt-4o-mini'
          labels: 'bug, feature, documentation, enhancement, question, help, '
      
  
    
  
